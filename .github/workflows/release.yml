name: Build the Mac app

# Builds Still as one disk image that runs on every Mac (Apple silicon and
# Intel) and keeps it as a draft release on GitHub.
#
# Nothing here signs the app or puts it on the website. To offer a build,
# download the image from the draft release and upload it in the admin
# portal's Releases tab (apps/api, "Downloads").
#
# Runs when a tag such as v0.1.0 is pushed, or by hand from the Actions tab.
#
# Not run yet: this file was written before the repository had its first push.
# Read the first run's log before trusting it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # to create the draft release

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add both kinds of Mac chip to Rust
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install packages
        run: npm ci --prefix apps/web && npm ci --prefix apps/desktop

      - name: Build
        working-directory: apps/desktop
        run: npx tauri build --target universal-apple-darwin

      - name: Find the disk image
        id: dmg
        run: echo "path=$(ls apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Still-mac-universal
          path: ${{ steps.dmg.outputs.path }}

      - name: Keep it as a draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" --draft --title "$GITHUB_REF_NAME" --notes "Unsigned beta build for macOS 12 or later."
