<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tidal</title>
<!--
  Tidal - a live wallpaper scene (canvas scene, live scene standard 1).
  By Still Originals. Licence: Still Original.
  One self-contained file made by scenekit: it can load nothing and send nothing.

  Geometry comes from the URL fragment (all values in points):
    #cw=<canvas width>&ch=<canvas height>&vx=<window x in canvas>&vy=<window y in canvas>&paused=0|1
  Defaults: cw and ch are the window's own size, vx=0, vy=0, paused=0.
  Every window draws its own part of one shared picture, and animation time is taken
  from the wall clock, so several windows line up in space and stay in step in time.

  Optional, for capturing stills only: &t=<seconds> freezes the scene at that moment
  of its 240 second loop and draws a single frame. Absent, it changes nothing.
-->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0d1a}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block}
body.still{background:linear-gradient(200deg,#0d0e1b 0%,#4c2640 35%,#c97878 65%,#f5dbb8 100%) no-repeat}
body.still canvas{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script id="fs" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec4 uC;   // shared canvas: width, height, this window's x, y (CSS points, y down)
uniform vec4 uW;   // this window: width, height (CSS points), buffer width, height (pixels)
uniform float uT;  // phase of the loop, 0..1, from the wall clock
const float TAU = 6.2831853;

float h21(vec2 p){ vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
vec2 h22(vec2 p){ vec3 q = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); q += dot(q, q.yzx + 33.33); return fract((q.xx + q.yz) * q.zy); }

// Gradient noise, roughly -0.6..0.6, smooth second derivative.
float gn(vec2 p){
  vec2 i = floor(p), f = fract(p), u = f * f * f * (f * (f * 6. - 15.) + 10.);
  float a = dot(h22(i) * 2. - 1., f);
  float b = dot(h22(i + vec2(1., 0.)) * 2. - 1., f - vec2(1., 0.));
  float c = dot(h22(i + vec2(0., 1.)) * 2. - 1., f - vec2(0., 1.));
  float d = dot(h22(i + vec2(1., 1.)) * 2. - 1., f - vec2(1., 1.));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

// A point going round a unit circle k times per loop: moving noise lookups along it
// makes motion that repeats exactly when the wall clock wraps.
vec2 orbit(float k, float ph){ float a = TAU * k * uT + ph; return vec2(cos(a), sin(a)); }

#define DITHER 1.0

float fbm(vec2 p){
  return .62 * gn(p) + .30 * gn(mat2(.8, -.6, .6, .8) * p * 1.9 + vec2(3.1, 7.7));
}

vec3 scene(vec2 p, vec2 uv, float asp, float px){
  vec2 q = p * .62 + vec2(11.81, 6.89);
  vec2 o1 = orbit(1., 0.), o2 = orbit(2., 1.7), o3 = orbit(1., 4.1);

  // Two rounds of domain warping: large fields that fold into one another.
  vec2 w = vec2(fbm(q + .075 * o1), fbm(q + vec2(5.2, 1.3) + .075 * o1.yx));
  vec2 v = vec2(fbm(q + 1.8 * w + vec2(1.7, 9.2) + .035 * o2), fbm(q + 1.8 * w + vec2(8.3, 2.8) - .035 * o2.yx));
  float f = fbm(q + 2.0 * v + .06 * o3);

  // One broad ramp from ink through plum and rose to champagne.
  float g = f * 1.25 + v.y * .9 + w.x * .5 + dot(p, vec2(-.10, -.22));
  g = smoothstep(-.72, .78, g);

  vec3 ink   = vec3(.045, .050, .100);
  vec3 plum  = vec3(.330, .130, .235);
  vec3 rose  = vec3(.830, .430, .430);
  vec3 coral = vec3(.940, .640, .500);
  vec3 champ = vec3(.970, .880, .740);

  vec3 warm = mix(rose, coral, smoothstep(-.25, .25, w.y - v.x));
  // Only the broad, slow field may go all the way to ink; narrow folds stop at plum.
  vec3 dark = mix(plum * .85, ink, smoothstep(-.02, .22, -w.x - .3 * dot(p, vec2(-.10, -.22))));
  vec3 col = mix(dark, plum, smoothstep(.02, .30, g));
  col = mix(col, warm, smoothstep(.22, .60, g));
  col = mix(col, champ, smoothstep(.62, 1., g));

  // A soft sheen along the folds.
  float sh = smoothstep(.05, .45, v.x - w.y * .6) * smoothstep(.25, .70, g);
  col += vec3(.10, .07, .05) * sh;
  return col;
}

void main(){
  vec2 s = uW.xy / uW.zw;                                              // CSS points per buffer pixel
  vec2 pt = vec2(gl_FragCoord.x, uW.w - gl_FragCoord.y) * s + uC.zw;   // position in the shared canvas, y down
  vec2 uv = pt / uC.xy;                                                // 0..1 across the whole canvas
  float asp = uC.x / uC.y;
  vec2 p = vec2((uv.x - .5) * asp, .5 - uv.y);                         // centred, y up, canvas height = 1
  vec3 col = scene(p, uv, asp, s.y / uC.y);
  // Triangular dither of about one 8-bit step, so slow gradients never band.
  float n = h21(gl_FragCoord.xy) + h21(gl_FragCoord.xy + 31.7) - 1.;
  gl_FragColor = vec4(col + n * DITHER / 255., 1.);
}
</script>
<script>
(function () {
  'use strict';
  var LOOP_MS = 240 * 1000;    // the scene's time runs round this period, taken from the wall clock
  var FADE_MS = 0 * 1000;    // 0, or how long a shader that does not loop by itself dissolves across the join
  var MAX_SIDE = 1100;          // longest side of the render buffer, in pixels (upscaled by CSS)
  var FRAME_MS = 1000 / 30;       // 30 fps cap
  var NEWER = false;             // true: the shader is tried as GLSL ES 3.00 first (needs WebGL 2), then as 1.00

  var root = document.documentElement;
  var canvas = document.getElementById('c');
  var gl = null, uC = null, uW = null, uT = null, uK = null, uD = null;
  var raf = 0, last = 0, lost = false;
  var g = { cw: 1, ch: 1, vx: 0, vy: 0, paused: false, t: null };

  function winW() { return Math.max(1, window.innerWidth || 1); }
  function winH() { return Math.max(1, window.innerHeight || 1); }

  function readHash() {
    var o = {}, kv = location.hash.slice(1).split('&'), i, j;
    for (i = 0; i < kv.length; i++) {
      j = kv[i].indexOf('=');
      if (j > 0) o[kv[i].slice(0, j)] = parseFloat(kv[i].slice(j + 1));
    }
    g.cw = o.cw > 0 ? o.cw : winW();
    g.ch = o.ch > 0 ? o.ch : winH();
    g.vx = isFinite(o.vx) ? o.vx : 0;
    g.vy = isFinite(o.vy) ? o.vy : 0;
    g.paused = o.paused === 1;
    g.t = isFinite(o.t) ? o.t : null;
  }

  function compile(type, src, why) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (gl.getShaderParameter(s, gl.COMPILE_STATUS)) return s;
    why.push(String(gl.getShaderInfoLog(s) || 'did not compile'));
    return null;
  }

  // Build the program. `first` is put in front of both shaders: empty for GLSL ES 1.00.
  function link(first, why) {
    var vert = first ? 'in vec2 a;' : 'attribute vec2 a;';
    var vs = compile(gl.VERTEX_SHADER, first + vert + 'void main(){gl_Position=vec4(a,0.,1.);}', why);
    // Two lines go in front either way, so a compiler message names the same line in both versions.
    var fs = compile(gl.FRAGMENT_SHADER, (first || '\n\n') + document.getElementById('fs').textContent.replace(/^\s+/, ''), why);
    if (!vs || !fs) return null;
    var p = gl.createProgram();
    gl.attachShader(p, vs); gl.attachShader(p, fs);
    gl.bindAttribLocation(p, 0, 'a');
    gl.linkProgram(p);
    if (gl.getProgramParameter(p, gl.LINK_STATUS)) return p;
    why.push(String(gl.getProgramInfoLog(p) || 'did not link'));
    return null;
  }

  function setup() {
    var opts = { alpha: false, antialias: false, depth: false, stencil: false,
                 premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'low-power' };
    var two = false, why = [], p = null;
    gl = null;
    try {
      if (NEWER) { gl = canvas.getContext('webgl2', opts); two = !!gl; }
      if (!gl) gl = canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts);
    } catch (e) { gl = null; }
    if (!gl) { root.setAttribute('data-scene', 'still'); root.setAttribute('data-scene-error', 'WebGL is not available'); return false; }
    if (two) p = link('#version 300 es\n#define SK_ES3 1\n', why);
    if (!p) { two = false; p = link('', why); }
    if (!p) { gl = null; root.setAttribute('data-scene', 'still'); root.setAttribute('data-scene-error', why.join('\n').slice(0, 4000)); return false; }
    root.setAttribute('data-scene', two ? 'webgl2' : 'webgl');
    gl.useProgram(p);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
    uC = gl.getUniformLocation(p, 'uC');
    uW = gl.getUniformLocation(p, 'uW');
    uT = gl.getUniformLocation(p, 'uT');
    uK = gl.getUniformLocation(p, 'uK');
    uD = gl.getUniformLocation(p, 'uD');
    return true;
  }

  // No WebGL: show a still gradient in the scene's colours, placed by the same geometry.
  function still() {
    var b = document.body;
    b.className = 'still';
    b.style.backgroundSize = g.cw + 'px ' + g.ch + 'px';
    b.style.backgroundPosition = (-g.vx) + 'px ' + (-g.vy) + 'px';
  }

  function fit() {
    var w = winW(), h = winH(), dpr = window.devicePixelRatio || 1;
    var s = Math.min(dpr, MAX_SIDE / Math.max(w, h));
    var bw = Math.max(1, Math.round(w * s)), bh = Math.max(1, Math.round(h * s));
    if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
    if (gl) gl.viewport(0, 0, bw, bh);
  }

  function draw() {
    if (!gl || lost) return;
    var ms = g.t !== null ? g.t * 1000 : Date.now();
    var into = ((ms % LOOP_MS) + LOOP_MS) % LOOP_MS;        // milliseconds into the loop
    gl.uniform4f(uC, g.cw, g.ch, g.vx, g.vy);
    gl.uniform4f(uW, winW(), winH(), canvas.width, canvas.height);
    gl.uniform1f(uT, into / LOOP_MS);
    if (uK) {
      // Time in seconds for shaders that count seconds. In the last FADE_MS of the loop the
      // picture is blended with the one a whole loop earlier, so the join is never a jump.
      var now = (FADE_MS + into) / 1000, k = FADE_MS > 0 ? Math.max(0, (into - (LOOP_MS - FADE_MS)) / FADE_MS) : 0;
      gl.uniform4f(uK, now, now - LOOP_MS / 1000, k * k * (3 - 2 * k), Math.floor(now * 30));
    }
    if (uD) {
      var d = new Date();
      gl.uniform4f(uD, d.getFullYear(), d.getMonth(), d.getDate(),
        g.t !== null ? g.t : d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() + d.getMilliseconds() / 1000);
    }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function tick(now) {
    raf = requestAnimationFrame(tick);
    if (now - last < FRAME_MS - 2) return;
    last = now;
    draw();
  }

  // Run the loop only while visible and not paused; otherwise leave exactly one still frame.
  function sync() {
    if (!gl) { still(); return; }
    var run = !g.paused && g.t === null && !document.hidden && !lost;
    if (run) {
      if (!raf) raf = requestAnimationFrame(tick);
    } else {
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      if (!document.hidden) draw();
    }
  }

  window.addEventListener('hashchange', function () { readHash(); sync(); });
  window.addEventListener('resize', function () { readHash(); fit(); if (raf) draw(); sync(); });
  document.addEventListener('visibilitychange', sync);
  canvas.addEventListener('webglcontextlost', function (e) {
    e.preventDefault(); lost = true;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  });
  canvas.addEventListener('webglcontextrestored', function () {
    lost = false;
    if (setup()) fit();
    sync();
  });

  readHash();
  if (setup()) fit();
  sync();
})();
</script>
</body>
</html>
