<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- scenekit:policy -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiet Clock</title>
<!-- scenekit:notes
  Quiet Clock - the source of a per-display live wallpaper scene.

  HOW TO WORK ON THIS FILE
  Fill in the four marked places, then run
      python3 scenekit.py build quiet-clock
  and open ../scenes/quiet-clock/scene.html in a browser to look. Edit this file, never that one.

  The three comments whose text starts with "scenekit" are replaced when building: by the
  security policy, by a short header (this note is left out of the finished scene), and by
  the shared runtime. Leave them where they are; the policy one must stay directly after
  the charset line.

  Rules that keep a scene publishable (the standard has the full list):
  - Everything stays inside this one file. No addresses, no loading, no storing, no frames.
  - Slow and quiet: it sits behind someone's work. No selectable text, no pointer effects.
  - Draw only from the hooks below; never start timers or animation loops of your own, and
    avoid CSS animations. The runtime then handles pause, hidden pages and the frame cap.
  - Lay out from the window size given to layout(); ignore the cw/ch/vx/vy geometry values.
-->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05081a}
body{-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;
  font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;color:#fbf7ef}

/* The block sits a little above the middle, clear of the menu bar and of icons along the edges. */
#clock{position:fixed;left:0;right:0;top:43%;transform:translateY(-50%);text-align:center;
  text-shadow:0 0 .6em rgba(8,12,40,.16)}
#time{position:relative;display:inline-block;font-weight:200;line-height:1;letter-spacing:-.018em;
  font-variant-numeric:lining-nums proportional-nums;white-space:nowrap}
#time .colon{position:relative;top:-.075em;margin:0 .012em;opacity:.9}
/* AM or PM hangs outside the digits, so the digits themselves stay centred. */
#time .half{position:absolute;bottom:.19em;font-size:.165em;font-weight:500;letter-spacing:.07em;opacity:.72}
#before{right:100%;margin-right:.75em}
#after{left:100%;margin-left:.75em}
#date{font-weight:400;letter-spacing:.012em;opacity:.84;white-space:nowrap}
</style>
</head>
<body>
<div id="clock">
  <div id="time"><span id="before" class="half"></span><span id="hour"></span><span id="between"></span><span id="minute"></span><span id="after" class="half"></span></div>
  <div id="date"></div>
</div>

<!-- scenekit:runtime -->
<script>
(function () {
  'use strict';
  var TAU = 6.2831853;
  var time = document.getElementById('time'), date = document.getElementById('date');
  var hour = document.getElementById('hour'), between = document.getElementById('between'), minute = document.getElementById('minute');
  var before = document.getElementById('before'), after = document.getElementById('after');

  // 12 or 24 hours, the separator and the order all follow the system's own settings.
  var clock = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });
  var day = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

  // The sky through the day: hour, then upper, middle and lower colour, then the colour,
  // height and strength of the low light. Between two rows everything is blended.
  var SKY = [
    [ 0.00, '#05081a', '#0b1230', '#171c44', '#2b3a80', 0.95, 0.30],
    [ 4.50, '#070b20', '#121a3e', '#272752', '#3a3f8a', 0.95, 0.32],
    [ 5.75, '#10183c', '#2f3266', '#7a5278', '#c97a8a', 0.98, 0.45],
    [ 6.75, '#24407a', '#6d7bb0', '#e3a58c', '#ffc59a', 0.98, 0.55],
    [ 8.50, '#28569a', '#5587c0', '#9dbddb', '#fff0d0', 0.85, 0.26],
    [12.50, '#265ca4', '#4a86c6', '#8fb6dc', '#ffffff', 0.25, 0.15],
    [16.50, '#2a5797', '#5a87bd', '#a9bcd4', '#ffe9c4', 0.80, 0.26],
    [18.25, '#2f4a80', '#8b7ba0', '#eaa66f', '#ffc27a', 0.98, 0.55],
    [19.50, '#1a2254', '#54407a', '#c2636c', '#f08a6a', 1.00, 0.50],
    [20.75, '#0c1238', '#262a5e', '#5a3a6c', '#7a4a8a', 1.00, 0.38],
    [22.00, '#05081a', '#0b1230', '#171c44', '#2b3a80', 0.95, 0.30],
    [24.00, '#05081a', '#0b1230', '#171c44', '#2b3a80', 0.95, 0.30]
  ];

  function blend(a, b, k) {
    var x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16), out = '#', i, u, v;
    for (i = 16; i >= 0; i -= 8) {
      u = x >> i & 255; v = y >> i & 255;
      out += ('0' + Math.round(u + (v - u) * k).toString(16)).slice(-2);
    }
    return out;
  }

  function sky(now) {
    var h = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600, i = 0;
    while (i < SKY.length - 2 && h >= SKY[i + 1][0]) i++;
    var a = SKY[i], b = SKY[i + 1], k = (h - a[0]) / (b[0] - a[0]);
    k = k * k * (3 - 2 * k);
    return { colors: [blend(a[1], b[1], k), blend(a[2], b[2], k), blend(a[3], b[3], k)],
             light: blend(a[4], b[4], k), y: a[5] + (b[5] - a[5]) * k, strength: a[6] + (b[6] - a[6]) * k };
  }

  Scene.start({
    layout: function (width, height) {
      var size = Math.min(height * 0.21, width * 0.15);
      time.style.fontSize = size + 'px';
      time.style.fontWeight = size < 110 ? 300 : 200;
      date.style.fontSize = Math.max(9, size * 0.118) + 'px';
      date.style.marginTop = (size * 0.10) + 'px';
    },

    // The digits and the date: at the start and on each new minute, also while paused.
    minute: function (now) {
      var parts = clock.formatToParts(now), h = '', m = '', sep = ':', half = '', first = true, i, p;
      for (i = 0; i < parts.length; i++) {
        p = parts[i];
        if (p.type === 'hour') h = p.value;
        else if (p.type === 'minute') m = p.value;
        else if (p.type === 'dayPeriod') { half = p.value; first = h === ''; }
        else if (p.type === 'literal' && h !== '' && m === '' && p.value.trim() !== '') sep = p.value.trim();
      }
      hour.textContent = h;
      minute.textContent = m;
      between.textContent = sep;
      between.className = sep === ':' ? 'colon' : '';
      before.textContent = first ? half : '';
      after.textContent = first ? '' : half;
      date.textContent = day.format(now);
    },

    // The sky: its colours follow the hour, and one soft light wanders very slowly.
    // Five pictures a second is plenty for something this slow.
    fps: 5,
    frame: function (now) {
      var s = sky(now), a = TAU * Scene.phase(300);
      Scene.backdrop({ colors: s.colors, lights: [
        { color: s.light, x: 0.5 + 0.16 * Math.sin(a), y: s.y + 0.03 * Math.cos(2 * a), size: 0.78, strength: s.strength },
        { color: blend(s.colors[0], '#ffffff', 0.22), x: 0.5 - 0.22 * Math.sin(a + 1), y: 0.08, size: 0.9, strength: 0.14 }
      ] });
    }
  });
})();
</script>
</body>
</html>
